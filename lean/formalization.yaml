status:
  scope: >-
    Solvability theory of linear second-order elliptic operators in divergence form on a
    bounded domain, with bounded measurable coefficients and a non-zero drift, so the
    bilinear form is in general non-symmetric. The library carries existence and
    uniqueness through Lax-Milgram, the Gårding inequality, the Fredholm alternative with
    its index and solvability clauses, the resolvent bound, spectral compactness, interior
    H² regularity, higher interior regularity at every order, infinite differentiability
    in the interior, and interior Hölder continuity at exponent 1/2 in dimensions one, two
    and three. Boundary H² regularity has its foundations in place and its headline
    estimate open. This submission covers the Fredholm alternative alone.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Palomar.fredholm_alternative"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

