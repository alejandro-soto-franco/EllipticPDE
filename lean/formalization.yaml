# development was written with, which the house-style linter otherwise refuses.
# Waiving that one rule leaves every other rule in force.
# prose-tics: allow ai-attribution
version: "v0.4"

project:
  name: "EllipticPdes"
  description: >-
    A Lean 4 formalisation of the solvability theory of linear second-order elliptic
    operators in divergence form on a bounded domain,

      -div(A grad u) + b · grad u + c u = f in Ω,   u = 0 on ∂Ω,

    with A uniformly elliptic and every coefficient bounded and measurable. The drift b
    is unrestricted, so the bilinear form is in general non-symmetric and the problem
    carries no variational structure; existence runs through Lax-Milgram.

    Proved with no `sorry` in the library: the Gårding inequality for the general
    operator on any domain; existence and uniqueness of the weak solution, which needs a
    coercive form and so is proved for a bounded domain with no drift and a nonnegative
    zeroth-order coefficient; the Fredholm alternative for the general operator on a
    bounded domain, which is what governs solvability when the form is not
    coercive, together with its solvability criterion against the transpose problem; the
    discrete set of μ off which L u = μ u + f is uniquely solvable, and boundedness of the
    inverse off that set; spectral compactness of the operator; interior H² regularity;
    higher interior regularity at every order; infinite differentiability in the interior;
    and interior Hölder continuity at exponent 1/2 in dimensions one, two and three.

    Supporting layers carry Morrey's inequality, the Gagliardo-Nirenberg-Sobolev estimate
    in general dimension and at a general exponent pair, Campanato's characterisation of
    Hölder continuity with its converse, the Caccioppoli inequality, and the Poincaré
    chain down to the one-dimensional inequality. H_0^1(Ω) is realised as the closure of
    the test-function graphs inside L²(Ω) × (L²(Ω))^d, so a member carries its weak
    gradient as data rather than through a weak-derivative predicate.

    Boundary H² regularity has its foundations in place and its headline estimate open,
    and Schauder C^{k,α} estimates remain a roadmap item.

    The Comparator configuration of this submission selects six declarations and no
    others, the solvability theory of Evans §6.2: the Gårding inequality, existence and
    uniqueness for a bounded domain with no drift and a nonnegative zeroth-order
    coefficient, the Fredholm alternative, solvability against the transpose problem, the
    discrete set of exceptional μ, and boundedness of the inverse. It excludes the
    interior-regularity results of the library, which are interior H² regularity, higher
    interior regularity, infinite differentiability in the interior and interior Hölder
    continuity, along with the spectral results and the Poincaré chain. Those are listed
    under status.main_results without a Comparator configuration and will take their own
    challenge and solution modules in a later submission.
  authors:
    - "Alejandro Soto Franco"
    - "Kobe Marshall-Stevens"
  responsible_maintainers:
    - "Alejandro Soto Franco"
  license: "Apache-2.0"

