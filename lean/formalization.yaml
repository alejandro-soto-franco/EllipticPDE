# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# Palomar requires the automation disclosure below to name the model the
# development was written with, which the house-style linter otherwise refuses.
# Waiving that one rule leaves every other rule in force.
# prose-tics: allow ai-attribution
version: "v0.4"

project:
  name: "EllipticPdes"
  description: >-
    A Lean 4 formalisation of the solvability theory of linear second-order elliptic
    operators in divergence form on a bounded domain,

      -div(A grad u) + b · grad u + c u = f in Ω,   u = 0 on ∂Ω,

    with A uniformly elliptic and every coefficient bounded and measurable. The drift b
    is unrestricted, so the bilinear form is in general non-symmetric and the problem
    carries no variational structure; existence runs through Lax-Milgram.

    Proved for the general operator, with no `sorry` in the library: existence and
    uniqueness of the weak solution; the Gårding inequality; the Fredholm alternative
    with its kernel, index and solvability clauses; the resolvent bound; spectral
    compactness of the operator; interior H² regularity; higher interior regularity at
    every order; infinite differentiability in the interior; and interior Hölder
    continuity at exponent 1/2 in dimensions one, two and three.

    Supporting layers carry Morrey's inequality, the Gagliardo-Nirenberg-Sobolev estimate
    in general dimension and at a general exponent pair, Campanato's characterisation of
    Hölder continuity with its converse, the Caccioppoli inequality, and the Poincaré
    chain down to the one-dimensional inequality. H_0^1(Ω) is realised as the closure of
    the test-function graphs inside L²(Ω) × (L²(Ω))^d, so a member carries its weak
    gradient as data rather than through a weak-derivative predicate.

    Boundary H² regularity has its foundations in place and its headline estimate open,
    and Schauder C^{k,α} estimates remain a roadmap item. This entry registers the
    Fredholm alternative.
  authors:
    - "Alejandro Soto Franco"
  responsible_maintainers:
    - "Alejandro Soto Franco"
  license: "Apache-2.0"

sources:
  - title: "Partial Differential Equations (2nd edition), Graduate Studies in Mathematics 19"
    authors:
      - "Evans, Lawrence C."
    id: "American Mathematical Society, 2010"
    type: "book"
    location: "§6.2.3, Theorem 4(i), p. 321"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"

related_formalizations: []

classification:
  arxiv: ["math.AP"]
  msc2020: ["35J25", "47A53", "35A01", "35A02"]

status:
  scope: >-
    Solvability theory of linear second-order elliptic operators in divergence form on a
    bounded domain, with bounded measurable coefficients and a non-zero drift, so the
    bilinear form is in general non-symmetric. The library carries existence and
    uniqueness through Lax-Milgram, the Gårding inequality, the Fredholm alternative with
    its index and solvability clauses, the resolvent bound, spectral compactness, interior
    H² regularity, higher interior regularity at every order, infinite differentiability
    in the interior, and interior Hölder continuity at exponent 1/2 in dimensions one, two
    and three. Boundary H² regularity has its foundations in place and its headline
    estimate open. This submission covers the Fredholm alternative alone.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Palomar.fredholm_alternative"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code in a terminal on a local workstation, running lake and the repository's
        own checks directly. No retrieval harness or proof-search tool was involved, and
        no model beyond the one named.
      cost:
        wall_time: "about eleven weeks, 2026-06-01 to 2026-08-19"
        spend_usd: "subscription"
        hardware: "API-only, on a local workstation"
      prompting_notes: >-
        Statement-first: a target theorem was named with its literature locator, the
        declaration and its hypotheses were fixed by hand, and the proof was developed
        against `lake build`. Sorries were permitted on a branch and never on the default
        branch, which CI enforces.
  spend_usd: "subscription-based usage"
  notes: >-
    The development was written with substantial assistance from Claude Opus 4.5 under
    Claude Code, directed and reviewed by the author throughout. Every statement in the
    library was chosen and read by the author; the axiom set of each headline result is
    pinned in `lean/AxiomAudit.lean` and each is paired with its literature statement in
    `proofsense/manifest.json`, both checked in CI. Wall time spans the private manuscript
    repository from 2026-06-01; the public repository carries the library from 2026-08-02.

fidelity:
  divergences: >-
    Evans derives the compactness of the embedding H_0^1(Ω) ↪ L²(Ω) from boundedness of
    the domain through the Rellich-Kondrachov theorem; here it is a hypothesis, so the
    statement holds for any Ω whose embedding is compact and asks nothing of the geometry
    or the regularity of the boundary. The right-hand side is a bounded linear functional
    on H_0^1(Ω) rather than an f ∈ L²(Ω); the L² case is the image of f under the pairing
    v ↦ ∫_Ω f v. Coefficients are measurable and bounded on ℝ^d, with the bounds holding
    almost everywhere for Lebesgue measure, rather than being defined on Ω alone.
    H_0^1(Ω) is realised as the closure of the test-function graphs inside
    L²(Ω) × (L²(Ω))^d, so a member carries its weak gradient as data rather than through a
    weak-derivative predicate; the challenge statement spells that encoding out and reads
    the bilinear form off the graph coordinates.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Every declaration the repository presents as a headline result is pinned to the axioms
    propext, Classical.choice and Quot.sound in lean/AxiomAudit.lean, checked in CI. Each
    is separately paired with the literature statement it formalises in
    proofsense/manifest.json, and verify/proofsense_coverage.py holds that pairing to
    statement-granular locators and refuses an unwarranted declaration.

alignment:
  namespace: "Palomar"
  statements:
    - source: "Evans §6.2.3, Theorem 4(i), p. 321 (Second Existence Theorem for weak solutions)"
      lean: "Palomar.fredholm_alternative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Evans states the alternative for the operator L u = -(a^{ij} u_{x_i})_{x_j} +
        b^i u_{x_i} + c u on the bounded open U carrying the standing hypotheses of §6.2,
        and for data f ∈ L²(U). The formal statement asks instead for compactness of the
        embedding, which is what the proof consumes, and quantifies the right-hand side
        over the dual of H_0^1(Ω), of which the L² data are the image under v ↦ ∫_Ω f v.

acknowledgements: >-
  Built on Mathlib. The Sobolev layer realises H_0^1(Ω) inside the graph space rather than
  through a weak-derivative predicate, so nothing in it depends on a Sobolev-space API
  that Mathlib does not yet carry.
