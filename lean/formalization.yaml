automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code in a terminal on a local workstation, running lake and the repository's
        own checks directly. No retrieval harness or proof-search tool was involved, and
        no model beyond the one named.
      cost:
        wall_time: "about eleven weeks, 2026-06-01 to 2026-08-19"
        spend_usd: "subscription"
        hardware: "API-only, on a local workstation"
      prompting_notes: >-
        Statement-first: a target theorem was named with its literature locator, the
        declaration and its hypotheses were fixed by hand, and the proof was developed
        against `lake build`. Sorries were permitted on a branch and never on the default
        branch, which CI enforces.
  spend_usd: "subscription-based usage"
  notes: >-
    The development was written with substantial assistance from Claude Opus 4.5 under
    Claude Code, directed and reviewed by the author throughout. Every statement in the
    library was chosen and read by the author; the axiom set of each headline result is
    pinned in `lean/AxiomAudit.lean` and each is paired with its literature statement in
    `proofsense/manifest.json`, both checked in CI. Wall time spans the private manuscript
    repository from 2026-06-01; the public repository carries the library from 2026-08-02.

fidelity:
  divergences: >-
    Compactness of the embedding H_0^1(Ω) ↪ L²(Ω) is derived, not assumed. Five of the six
    compared statements hypothesise only that Ω is bounded and open, and the library proves
    the Rellich-Kondrachov compact embedding from boundedness and measurability alone; the
    Gårding inequality hypothesises nothing about Ω. The library states its solvability
    theory for a bounded measurable Ω, and the compared statements narrow that to an open
    Ω, because a test function has tsupport φ ⊆ Ω: on a set of positive measure with
    empty interior every test function vanishes, H_0^1(Ω) collapses to zero and unique
    solvability holds without expressing any Dirichlet problem. Openness is what makes the
    conclusions have content. No statement in this submission takes
    compactness, or any boundary regularity, as a hypothesis. The library does carry
    theorems conditioned on compactness directly, `fredholm_alternative_rellich` and
    `fredholm_alternative` among them, and those are not the declarations compared here.
    Evans works on a bounded open U carrying the standing hypotheses of §6.2, which include
    boundary regularity; the compared statements ask less of the domain than that.
    The right-hand side of the Fredholm alternative and of the solvability criterion is a
    bounded linear functional on H_0^1(Ω) rather than an f ∈ L²(Ω); the L² case is the
    image of f under the pairing v ↦ ∫_Ω f v. Coefficients are measurable and bounded on
    ℝ^d, with the bounds holding almost everywhere for Lebesgue measure, rather than being
    defined on Ω alone. H_0^1(Ω) is realised as the closure of the test-function graphs
    inside L²(Ω) × (L²(Ω))^d, so a member carries its weak gradient as data rather than
    through a weak-derivative predicate; the challenge spells that encoding out and reads
    the bilinear form off the graph coordinates.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Every declaration the repository presents as a headline result is pinned to the axioms
    propext, Classical.choice and Quot.sound in lean/AxiomAudit.lean, checked in CI. Each
    is separately paired with the literature statement it formalises in
    proofsense/manifest.json, and verify/proofsense_coverage.py holds that pairing to
    statement-granular locators and refuses an unwarranted declaration.

alignment:
  namespace: "Palomar"
  statements:
    - source: "Evans §6.2.2, Theorem 2, p. 318 (Energy estimates)"
      lean: "Palomar.garding"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Evans states the two energy estimates with unnamed constants α, β > 0 and γ ≥ 0.
        The formal statement fixes β = λ/2 and γ = λ/2 + C + d B²/(2λ), which is the value
        the proof produces, and asks nothing of Ω. B and C are the bounds the operator
        structure supplies, satisfying |b_i| ≤ B and |c| ≤ C almost everywhere; neither is
        asked to be an essential supremum, so a caller supplying a loose bound obtains a
        larger shift than the sharp inequality would give. The shift cannot be dropped
        at that generality: coercivity in the H¹ norm needs a Poincaré inequality, which
        the next result obtains from boundedness.
    - source: "Evans §6.2.2, Theorem 3, p. 319 (First Existence Theorem for weak solutions)"
      lean: "Palomar.weak_solution_of_nonneg_zeroth"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Stated at b = 0 and c ≥ 0 almost everywhere on Ω, where Evans asks for the
        conditions on U. The constant C_P is existentially quantified after both Ω and the
        operator and has no Poincaré property in the statement, so the a-priori bound
        ‖u‖ ≤ ((C_P + 1)/λ) ‖f‖ asserts the existence of some constant rather than
        dependence on the domain alone. The proof supplies a Poincaré constant of Ω.
    - source: "Evans §6.2.3, Theorem 4(i), p. 321 (Second Existence Theorem for weak solutions)"
      lean: "Palomar.fredholm_alternative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Evans states the alternative for the operator L u = -(a^{ij} u_{x_i})_{x_j} +
        b^i u_{x_i} + c u on the bounded open U carrying the standing hypotheses of §6.2,
        and for data f ∈ L²(U). The formal statement asks for a bounded open Ω and nothing
        further about its boundary, and quantifies the right-hand side over the dual of
        H_0^1(Ω), of which the L² data are the image under v ↦ ∫_Ω f v.
    - source: "Evans §6.2.3, Theorem 4(iii), p. 321"
      lean: "Palomar.solvable_iff_orthogonal_transpose"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Evans states solvability as orthogonality to the solution space of the adjoint
        problem L* w = 0. The formal statement writes that space by its defining property,
        B[v, w] = 0 for every v, so no differentiability is asked of a coefficient and the
        adjoint appears only through the transposed form.
    - source: "Evans §6.2.3, Theorem 5, p. 323 (Third Existence Theorem for weak solutions)"
      lean: "Palomar.existence_three"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The equation is L u = μ u + f, in Evans's eigenvalue convention, so the weak form
        reads B[u, v] = μ ⟨u, v⟩ + ⟨f, v⟩ and Σ is the set of eigenvalues of L. Evans
        records Σ as at most countable and, if infinite, tending to infinity. The formal
        statement fixes Σ by the solvability property and states discreteness as finiteness
        below every level, which is the form the proof establishes.
    - source: "Evans §6.2.3, Theorem 6, p. 324 (Boundedness of the inverse)"
      lean: "Palomar.resolvent_bound"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The hypothesis is unique solvability at the shift for every right-hand side rather
        than membership of the complement of Σ; the two are equivalent by the previous
        result. The bound is on the L² norm of the solution, as in Evans.

acknowledgements: >-
  Built on Mathlib. The Sobolev layer realises H_0^1(Ω) inside the graph space rather than
  through a weak-derivative predicate, so nothing in it depends on a Sobolev-space API
  that Mathlib does not yet carry.
