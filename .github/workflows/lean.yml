name: lean

# Build the formalisation from a clean clone and check it against what the README
# claims: no `sorry`, no axiom beyond the classical three, and a clean pass of
# the environment-level linter. The only dependency is upstream Mathlib at a
# pinned revision, so a clean clone resolves without anything private.

on:
  push:
  pull_request:

jobs:
  # Every declaration AxiomAudit.lean pins is checked against the literature it
  # cites, so a result cannot be presented as literature-checked when no
  # warrant names it. Reads the manifest rather than the sources, which are
  # copyrighted and gitignored, so it needs neither Lean nor a key.
  warrant-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Every pinned declaration is warranted or exempt
        run: uv run python verify/proofsense_coverage.py
      - name: The coverage check's own tests
        working-directory: verify
        run: uv run --with pytest python -m pytest test_proofsense_coverage.py -q

      # Every locator a warrant or a docstring cites names a statement its
      # source numbers. It reads the transcriptions in the local Adduce
      # library, which a runner does not have, so it is skipped there and run
      # by `scripts/audit.sh` on a machine that does.
      - name: The locator audit's own tests
        working-directory: verify
        run: uv run --with pytest python -m pytest test_locator_audit.py -q

      - name: The content review's own tests
        working-directory: verify
        run: uv run --with pytest python -m pytest test_warrant_review.py -q

      - name: The Palomar challenge and solution share one set of definitions
        run: uv run python verify/palomar_sync.py

  lean:
    runs-on: ubuntu-latest
    # The two external checkers, pinned by revision. `lean4export` imports the
    # oleans this job builds, so its revision is the one whose `lean-toolchain`
    # matches `lean/lean-toolchain`; moving this library's toolchain moves that
    # pin too. `con-leche` builds under its own toolchain, which elan resolves
    # from its directory and which need not agree with this library's.
    env:
      CONLECHE_REV: 725f0f39be7f59cff1979c1a530c4ac84ac6d0fc
      LEAN4EXPORT_REV: cd502a76e05515e7d3e09eaefee1dfd8349ca592
    steps:
      - uses: actions/checkout@v7

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Builds `EllipticPdes` and `AxiomAudit`. That target pins every headline
      # result to [propext, Classical.choice, Quot.sound] with `#guard_msgs`, so a
      # change in the axiom set fails here instead of going unnoticed.
      - name: Build, including the axiom audit
        working-directory: lean
        run: |
          lake exe cache get || true
          lake build

      - name: Assert the development is free of sorry
        working-directory: lean
        run: |
          if grep -rn --include='*.lean' -E '(^|[^A-Za-z_.])sorry([^A-Za-z_]|$)' EllipticPdes; then
            echo "::error::sorry found in the development"
            exit 1
          fi
          echo "no sorry in EllipticPdes"

      # Batteries' linter frontend over the elaborated environment: docBlame,
      # unusedArguments, simpNF, synTaut and unusedHavesSuffices. These are the
      # checks a text-based linter cannot reach.
      - name: Environment linter
        working-directory: lean
        run: lake lint

      # The Palomar submission pair. `Challenge` states the Fredholm alternative in
      # Mathlib vocabulary and leaves the deliberate placeholder Comparator asks for;
      # `Solution` restates it under the same name and proves it from the library.
      # Comparator compares the two by name, so `Solution` cannot import `Challenge`
      # and the shared definitions are two copies.
      #
      # `Solution.lean` pins its own axiom set with `#guard_msgs`, so a `sorryAx`
      # reaching the proof fails this build. That is the check; a text search for the
      # word would only find the prose describing the challenge.
      - name: Build the Palomar challenge and solution
        working-directory: lean
        run: lake build Challenge Solution

      # An external check of the same development, by a checker whose own
      # consistency is proven in Lean, rather than by the elaborator that
      # produced these proofs. `con-leche` reads Lean's export format, and its
      # main theorem states that an accepted stream declares no constant of type
      # `False`, modelled in ZF without infinity and choice plus an ω-chain of
      # Grothendieck universes. It admits `propext`, `Classical.choice` and
      # `Quot.sound`, and rejects a stream that uses any other axiom, `sorryAx`
      # included.
      #
      # The stream is the dependency cone of every declaration `AxiomAudit.lean`
      # pins, read out of that file here, so a pin added there extends this
      # check with no edit to this workflow. On the 205 pins as of this commit
      # the cone is 58,597 declarations, 510 MB of stream, and checks in half a
      # minute on four workers under 1 GB.
      #
      # Exit 1 rejects a declaration and exit 2 declines one the checker does
      # not support. Both fail here: a decline says the check did not happen.
      - name: Check out con-leche
        uses: actions/checkout@v7
        with:
          repository: leanprover/con-leche
          ref: ${{ env.CONLECHE_REV }}
          path: con-leche

      - name: Check out lean4export
        uses: actions/checkout@v7
        with:
          repository: leanprover/lean4export
          ref: ${{ env.LEAN4EXPORT_REV }}
          path: lean4export

      # 541 targets, so a cold build is the long step here and a warm one is a
      # restore. The key is the pinned revision, which is what the build depends
      # on.
      - name: Cache the con-leche build
        uses: actions/cache@v4
        with:
          path: con-leche/.lake
          key: con-leche-${{ runner.os }}-${{ env.CONLECHE_REV }}

      - name: Build the exporter and the checker
        run: |
          set -euo pipefail
          (cd lean4export && lake build)
          (cd con-leche && lake build)

      - name: The audited declarations, checked by con-leche
        working-directory: lean
        run: |
          set -euo pipefail
          names=$(grep '#print axioms' AxiomAudit.lean | sed 's/#print axioms //')
          # Word splitting is the point: one argument per declaration.
          # shellcheck disable=SC2086
          # Absolute, because `lake env` runs the command from the package
          # root and a relative path would resolve against that.
          lake env "$GITHUB_WORKSPACE/lean4export/.lake/build/bin/lean4export" \
            EllipticPdes -- $names > "$RUNNER_TEMP/audited.ndjson"
          "$GITHUB_WORKSPACE/con-leche/.lake/build/bin/con-leche" \
            --verified "$RUNNER_TEMP/audited.ndjson"
          rm -f "$RUNNER_TEMP/audited.ndjson"
