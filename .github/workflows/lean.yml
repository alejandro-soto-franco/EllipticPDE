name: lean

# Build the formalisation from a clean clone and hold it to what the README
# claims: no `sorry`, no axiom beyond the classical three, and a clean pass of
# the environment-level linter. The only dependency is upstream Mathlib at a
# pinned revision, so a clean clone resolves without anything private.

on:
  push:
  pull_request:

jobs:
  # Every declaration AxiomAudit.lean pins is checked against the literature it
  # cites, so a result cannot be presented as literature-checked when no
  # warrant names it. Reads the manifest rather than the sources, which are
  # copyrighted and gitignored, so it needs neither Lean nor a key.
  warrant-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Every pinned declaration is warranted or exempt
        run: uv run python verify/proofsense_coverage.py
      - name: The coverage check's own tests
        working-directory: verify
        run: uv run --with pytest python -m pytest test_proofsense_coverage.py -q

      - name: The Palomar challenge and solution share one set of definitions
        run: uv run python verify/palomar_sync.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Builds `EllipticPdes` and `AxiomAudit`. That target pins every headline
      # result to [propext, Classical.choice, Quot.sound] with `#guard_msgs`, so a
      # change in the axiom set fails here instead of going unnoticed.
      - name: Build, including the axiom audit
        working-directory: lean
        run: |
          lake exe cache get || true
          lake build

      - name: Assert the development is free of sorry
        working-directory: lean
        run: |
          if grep -rn --include='*.lean' -E '(^|[^A-Za-z_.])sorry([^A-Za-z_]|$)' EllipticPdes; then
            echo "::error::sorry found in the development"
            exit 1
          fi
          echo "no sorry in EllipticPdes"

      # Batteries' linter frontend over the elaborated environment: docBlame,
      # unusedArguments, simpNF, synTaut and unusedHavesSuffices. These are the
      # checks a text-based linter cannot reach.
      - name: Environment linter
        working-directory: lean
        run: lake lint

      # The Palomar submission pair. `Challenge` states the Fredholm alternative in
      # Mathlib vocabulary and leaves it `sorry`; `Solution` restates it under the same
      # name and proves it from the library. Comparator compares the two by name, so
      # `Solution` cannot import `Challenge` and the shared definitions are two copies.
      - name: Build the Palomar challenge and solution
        working-directory: lean
        run: lake build Challenge Solution

      - name: Assert the Palomar solution is free of sorry
        working-directory: lean
        run: |
          if grep -n -E '(^|[^A-Za-z_.])sorry([^A-Za-z_]|$)' Solution.lean; then
            echo "::error::sorry found in Solution.lean"
            exit 1
          fi
          echo "no sorry in Solution.lean"
