# Palomar's mechanical verifier, run against this repository before a
# submission. Dispatch-only: it builds Mathlib and runs Comparator, kernel
# replay and the challenge provenance audit, which is too heavy for every push.
name: palomar-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight${{ github.run_number }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"lean","comparator_config_path":"lean/comparator.json","formalization_metadata_path":"lean/formalization.yaml","authorization_relationship":"maintainer"}'
